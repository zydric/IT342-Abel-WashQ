# ============================================================
#  Test profile — H2 in-memory DB (overrides main application.properties)
# ============================================================

# Override datasource — point to H2 instead of Supabase PostgreSQL
spring.datasource.url=jdbc:h2:mem:washq_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Override JPA — use H2 dialect and recreate schema each test run
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# JWT — static secret for tests (must be at least 256-bit for HS256)
jwt.secret=7468697369736174657374736563726574666f7277617368716a756e697474657374
jwt.expiration=86400000

# Disable dotenv import — no .env file needed in test environment
spring.config.import=

# Disable OpenWeatherMap API key requirement in tests
openweathermap.api.key=DISABLED_FOR_TESTS

# Disable Supabase DB connection (override with H2 above)
DB_URL=jdbc:h2:mem:washq_test
DB_USERNAME=sa
DB_PASSWORD=
