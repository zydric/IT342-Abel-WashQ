# ============================================================
# Test profile — active when @ActiveProfiles("test") is set
# This file has HIGHER priority than application.properties
# ============================================================

# H2 In-Memory Database — overrides Supabase PostgreSQL
spring.datasource.url=jdbc:h2:mem:washq_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA — H2 dialect with auto schema creation
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# JWT test secret (static, 256-bit minimum for HS256)
jwt.secret=7468697369736174657374736563726574666f7277617368716a756e697474657374
jwt.expiration=86400000

# No dotenv in test — disable the import
spring.config.import=

# No external API keys needed
openweathermap.api.key=TEST_DISABLED
